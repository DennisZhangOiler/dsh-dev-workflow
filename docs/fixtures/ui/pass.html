<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI pass fixture</title>
<style>
body{font:16px/1.5 system-ui;margin:0;color:#111;background:#fff}
main{max-width:720px;margin:40px auto;padding:0 20px}
button{font:inherit;padding:12px 20px;min-width:44px;min-height:44px;border:2px solid #111;background:#111;color:#fff;border-radius:8px}
:focus-visible{outline:3px solid #005fcc;outline-offset:3px}
label{display:block;margin:16px 0 6px;font-weight:600}
input{font:inherit;padding:10px;min-height:44px;width:100%;box-sizing:border-box;border:2px solid #555;border-radius:6px}
</style>
<main>
<h1>Project settings</h1>
<p>One clear primary action, readable contrast, keyboard focus, and mobile-safe layout.</p>
<label for="name">Project name</label><input id="name" value="Demo">
<p><button>Save changes</button></p>
</main></html>
