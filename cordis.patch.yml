# The R&D Workflow preset: one @deepseek-ai/dsh-agent-preset declaration.
#
# Installing this bundle inserts the preset; it does not select it, change the
# profile's default preset, or add any Host-wide row. A session uses the
# pipeline only after the user explicitly picks "研发流程" (R&D Workflow).
#
# The contract and playbooks come from dsh-rd-workflow, which
# is mounted inside this preset composition only.
- insert:
    - id: preset-dev-workflow
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dev-workflow
        # The id stays dev-workflow for existing session compatibility.
        # DSH 0.2.2-rc.5 does not localize user-authored preset metadata per
        # client locale (`presetDisplayText` translates only shipped presets).
        # The roster copy is therefore Chinese to match a zh-CN system; the
        # bundle card and detail page localize independently through
        # locale/*.json. To publish an English roster instead, replace these
        # two strings with the English copy in README.md.
        name: 研发流程
        description: 一个默认标准强度的研发流程 preset；在输入框左侧常驻“流程强度”下拉，可在对话中切换轻量/标准/深度（prompt 级指令，不换工具集）。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: rd-workflow-contract
            name: 'dsh-rd-workflow'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Explore first with read-only reads, searches, static analysis, and checks. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, risks, rollback, and explicit assumptions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response. A conversational agreement approves nothing and does not end plan mode; fold the confirmed decision into the plan and present it through exit_plan_mode. If review is unavailable, stay in plan mode and ask the user to switch modes manually.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
                  # root -> module lead -> specialist -> optional sub-specialist
                  maxDepth: 3
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  maxDepth: 3
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

# Global client half: the always-visible composer intensity selector. The row
# mounts the same package globally; index.js returns early outside a preset and
# only the dsh.client half registers the control.
- insert:
    - id: rd-mode-client
      name: 'dsh-rd-workflow'
